name: build-image
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t leks5113rus/docker-test-web:${{ github.sha }} -t leks5113rus/docker-test-web:latest .
      - run: docker push leks5113rus/docker-test-web --all-tags